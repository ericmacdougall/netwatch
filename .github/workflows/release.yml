name: release

# Disabled: releases are built and uploaded locally from dev2
# (scripts/build-release.sh + gh release create), per the no-GitHub-CI rule.
# The tag trigger was removed; this runs only if dispatched by hand.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: test
        run: go test -count=1 ./...
      - name: build
        env:
          VERSION: ${{ github.ref_name }}
        run: scripts/build-release.sh "$VERSION" dist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" dist/* --title "netwatch $VERSION" --generate-notes --verify-tag
